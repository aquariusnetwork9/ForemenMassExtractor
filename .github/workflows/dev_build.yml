name: Publish Development Build
on:
  push:
    # Branch pushes only — release tags are handled by release.yml.
    branches:
      - '**'

permissions:
  # Required for the snapshot release step; the repo's default token is read-only.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Loom 1.8 + Gradle 8.10 require JDK <= 21.
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        # Override the Windows JDK path pinned in gradle.properties with the runner's JDK 21.
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: snapshot
          name: Dev Build
          prerelease: true
          files: |
            ./build/libs/*.jar
