name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish as the official release (e.g. v1.3.5)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # On a tag push, build that tag; on manual dispatch, build the tag the user named.
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Loom 1.8 + Gradle 8.10 require JDK <= 21.
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        # Tags up to v1.3.5 were committed with gradlew at mode 100644 (no exec bit),
        # so make it runnable before invoking it.
        # Override the Windows JDK path pinned in gradle.properties with the runner's JDK 21.
        run: |
          chmod +x ./gradlew
          ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Official release, not a prerelease. An existing release for the tag is updated
          # in place (its name/notes are preserved) and the built jar is attached.
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./build/libs/*.jar
